<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Factory works</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/how.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="dashboard-header how-header">
        <div class="header-primary">
          <div class="wordmark-lockup">
            <svg
              class="factory-mark"
              viewBox="0 0 40 40"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 8h12v8H5zM23 8h12v8H23zM14 24h12v8H14z" />
              <path class="factory-mark-path" d="M11 16v4h9m9-4v4h-9v4" />
            </svg>
            <div>
              <p class="eyebrow">Software factory fleet</p>
              <h1 class="wordmark"><span>Factory</span></h1>
            </div>
          </div>
          <p class="machine-subtitle">
            A live map from intent to merged change
          </p>
        </div>
        <div class="header-secondary">
          <nav class="header-actions" aria-label="Dashboard pages">
            <a class="button button-secondary" href="/">Fleet dashboard</a>
          </nav>
        </div>
      </header>
      <p id="how-error" role="alert"></p>
      <section class="content-section how-intro" aria-labelledby="how-heading">
        <p class="eyebrow">How it works</p>
        <h2 id="how-heading">One guarded path from spec to merge</h2>
        <p>
          Static pipeline structure meets live routing, model limits, list
          prices, and metered cost from the selected machine.
        </p>
      </section>
      <div id="how-machine-tabs" role="tablist" aria-label="Machines"></div>
      <div id="how-machines"></div>
    </main>
  </body>
</html>
