<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory fleet</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Software factory fleet</p>
        <h1 id="machine">Loading local machine…</h1>
        <p id="generated" class="age">Waiting for snapshot…</p>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <p id="error" role="alert"></p>
      <section class="fleet-summary-section" aria-labelledby="fleet-heading">
        <h2 id="fleet-heading">Fleet summary</h2>
        <div class="table-scroll">
          <table id="fleet-summary">
            <thead>
              <tr>
                <th scope="col">Machine</th>
                <th scope="col">Liveness</th>
                <th scope="col">Current task</th>
                <th scope="col">PR</th>
                <th scope="col">Hold</th>
                <th scope="col">Questions</th>
                <th scope="col">Data age</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Repositories</h2>
        <div id="machine-tabs" role="tablist" aria-label="Machines"></div>
        <div id="repositories"></div>
      </section>
    </main>
  </body>
</html>
