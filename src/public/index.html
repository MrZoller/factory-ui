<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory fleet</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="dashboard-header">
        <div class="header-primary">
          <div class="wordmark-lockup">
            <svg
              class="factory-mark"
              viewBox="0 0 40 40"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 8h12v8H5zM23 8h12v8H23zM14 24h12v8H14z" />
              <path class="factory-mark-path" d="M11 16v4h9m9-4v4h-9v4" />
            </svg>
            <div>
              <p class="eyebrow">Software factory fleet</p>
              <h1 class="wordmark"><span>Factory</span></h1>
            </div>
          </div>
          <p id="machine" class="machine-subtitle">Loading local machine…</p>
        </div>
        <div class="header-secondary">
          <p id="generated" class="age">Waiting for snapshot…</p>
          <nav class="header-actions" aria-label="Dashboard pages">
            <a class="button button-secondary" href="/how">How it works</a>
            <a class="button button-secondary" href="#question-queue">
              Questions <span id="question-queue-count">0</span>
            </a>
            <a class="button button-secondary" href="#dependency-graph">
              Dependencies
            </a>
            <button id="refresh" class="button button-primary" type="button">
              Refresh
            </button>
          </nav>
        </div>
      </header>
      <p id="error" role="alert"></p>
      <section
        class="fleet-summary-section content-section"
        aria-labelledby="fleet-heading"
      >
        <h2 id="fleet-heading">Fleet summary</h2>
        <div class="table-scroll">
          <table id="fleet-summary">
            <thead>
              <tr>
                <th scope="col">Machine</th>
                <th scope="col">Liveness</th>
                <th scope="col">Current task</th>
                <th scope="col">PR</th>
                <th scope="col">Hold</th>
                <th class="numeric-cell" scope="col">Questions</th>
                <th class="numeric-cell" scope="col">Data age</th>
                <th class="numeric-cell" scope="col">Cost</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section
        id="dependency-graph"
        class="dependency-graph-section content-section"
        aria-labelledby="dependency-graph-heading"
      >
        <div class="section-heading-row">
          <div>
            <p class="eyebrow">Plan topology</p>
            <h2 id="dependency-graph-heading">Fleet dependencies</h2>
          </div>
          <div class="dependency-legend" aria-label="Dependency legend">
            <span class="dependency-edge dependency-edge-local">Local</span>
            <span class="dependency-edge dependency-edge-cross"
              >Cross-repo</span
            >
          </div>
        </div>
        <div id="dependency-graph-list" class="dependency-graph-groups"></div>
      </section>
      <section
        id="question-queue"
        class="question-queue-section content-section"
        aria-labelledby="question-queue-heading"
      >
        <h2 id="question-queue-heading">Question queue · 0</h2>
        <div id="question-queue-list"></div>
      </section>
      <section class="content-section" aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Repositories</h2>
        <div id="machine-tabs" role="tablist" aria-label="Machines"></div>
        <div id="repositories"></div>
      </section>
    </main>
  </body>
</html>
